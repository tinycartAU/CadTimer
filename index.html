<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>CadTimer</title>
  
  <link rel="apple-touch-icon" href="CadTimer_Logo.png">
  <link rel="icon" type="image/png" href="CadTimer_Logo.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-header">
    <img src="CadTimer_Logo.png" alt="Logo" class="header-logo">
    <h1>CadTimer</h1>
  </div>

  <div class="card display-panel">
    <div id="phase" class="phase-label">Ready</div>
    
    <div class="timer-container">
      <button class="btn-adjust" id="btn-minus">−</button>
      <div id="time-display" class="timer">00:00</div>
      <button class="btn-adjust" id="btn-plus">+</button>
    </div>

    <div id="tempo-display" class="info">-- SPM</div>
    <div id="flash" class="visual-flash"></div>

    <div class="controls">
      <button id="start-btn" class="main-btn btn-start">Start</button>
      <button id="reset-btn" class="main-btn btn-reset">Reset</button>
    </div>
  </div>

  <div class="presets-container">
    <div class="preset-wrapper">
      <button id="btn-preset-0" class="btn-preset">Routine 1</button>
      <button id="btn-edit-0" class="btn-preset-edit" title="Rename">✏️</button>
    </div>
    <div class="preset-wrapper">
      <button id="btn-preset-1" class="btn-preset">Routine 2</button>
      <button id="btn-edit-1" class="btn-preset-edit" title="Rename">✏️</button>
    </div>
    <div class="preset-wrapper">
      <button id="btn-preset-2" class="btn-preset">Default</button>
      <button id="btn-edit-2" class="btn-preset-edit" title="Rename">✏️</button>
    </div>
  </div>

  <div class="preset-actions">
    <button class="btn-save-preset" id="btn-save-preset">Save Changes to Active Slot</button>
    <button class="btn-reset-defaults" id="btn-reset-defaults" title="Reset factory defaults">↺ Reset Defaults</button>
  </div>

  <div class="card">
    <div id="blocks-container"></div>
    <button class="btn-add" id="btn-add-block">+ Add Interval</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
